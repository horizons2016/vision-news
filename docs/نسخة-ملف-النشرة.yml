name: النشرة الأسبوعية

on:
  schedule:
    - cron: "0 14 * * 6"          # السبت 6 مساءً بتوقيت مسقط: معاينة لك
  workflow_dispatch:
    inputs:
      mode:
        description: "preview = معاينة لي فقط ، send = إرسال للمختصين"
        type: choice
        options: [preview, send]
        default: preview
      week:
        description: "بداية الأسبوع (الأحد) بصيغة 2026-11-08 — اتركه فارغًا للأسبوع الأخير"
        required: false
      force:
        description: "إعادة الإرسال حتى لو أُرسلت نشرة هذا الأسبوع"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: vision-news
  cancel-in-progress: false

jobs:
  newsletter:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: بناء البيانات
        run: python scripts/build.py
      - name: إرسال النشرة
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          RECIPIENTS: ${{ secrets.RECIPIENTS }}
          RECIPIENTS_KEY: ${{ secrets.RECIPIENTS_KEY }}
          PREVIEW_TO: ${{ secrets.PREVIEW_TO }}
        run: |
          ARGS="${{ inputs.mode || 'preview' }}"
          if [ -n "${{ inputs.week }}" ]; then ARGS="$ARGS --week ${{ inputs.week }}"; fi
          if [ "${{ inputs.force }}" = "true" ]; then ARGS="$ARGS --force"; fi
          python scripts/newsletter.py $ARGS
      - name: حفظ سجل الإرسال
        run: |
          git config user.name "vision-news-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/state/newsletter_log.json
          if ! git diff --cached --quiet; then
            git commit -m "سجل النشرة $(date -u +'%Y-%m-%d')"
            git pull --rebase --autostash && git push
          fi
